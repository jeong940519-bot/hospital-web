<!DOCTYPE html>

<head>

<meta name="description" content="교감을 바탕으로, 통증 없는 일상을 위해 진심으로 진료합니다.">

<meta property="og:description" content="교감을 바탕으로, 통증 없는 일상을 위해 진심으로 진료합니다.">
<meta property="og:image" content="https://firebasestorage.googleapis.com/v0/b/newworld-1a1d5.firebasestorage.app/o/media%2F1786433707190_seo%EC%9D%B4%EB%AF%B8%EC%A7%802.jpg?alt=media&token=0cbc0adc-c050-470f-8822-65300406b09f">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="https://firebasestorage.googleapis.com/v0/b/newworld-1a1d5.firebasestorage.app/o/media%2F1786431031447_%EC%95%84%EC%9D%B4%EC%BD%98%EC%8B%AC%EB%B3%BC.png?alt=media&token=d3079313-e6c9-4d1b-a854-46f21cfff932">
<link rel="apple-touch-icon" href="https://firebasestorage.googleapis.com/v0/b/newworld-1a1d5.firebasestorage.app/o/media%2F1786431031447_%EC%95%84%EC%9D%B4%EC%BD%98%EC%8B%AC%EB%B3%BC.png?alt=media&token=d3079313-e6c9-4d1b-a854-46f21cfff932">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:#eee}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#445;text-align:center;line-height:1.7}
  #loading .spin{width:34px;height:34px;border:3px solid #ccd;border-top-color:#2b6cff;border-radius:50%;animation:sp 0.8s linear infinite}
  #loading a{color:#2b6cff;font-weight:700;text-decoration:none}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<script src="site-render.js"></script>
</head>
<body>
<div id="loading"><div class="spin"></div><div>홈페이지를 불러오는 중…</div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const app = initializeApp({
  apiKey:"AIzaSyDq3LRPvBDn1ZH6UDMPGDH_-LC7JnsEhLg",
  authDomain:"newworld-1a1d5.firebaseapp.com",
  projectId:"newworld-1a1d5",
  storageBucket:"newworld-1a1d5.firebasestorage.app",
  messagingSenderId:"948363397391",
  appId:"1:948363397391:web:5d7dee7a383f3bdec0167a"
});
const db = getFirestore(app);

(async ()=>{
  try{
    const snap = await getDoc(doc(db, 'site', 'editorProject'));
    if(!snap.exists() || !snap.data().data){ showEmpty(); return; }
    // 관리자가 편집기에서 홈페이지를 내려둔 상태 — 발행본 데이터는 그대로 두고 노출만 막는다.
    if(snap.data().published === false){ await showPaused(); return; }
    const project = JSON.parse(snap.data().data);
    if(!project.pages || !project.pages.length){ showEmpty(); return; }
    const baseW = (project.pages[0] && project.pages[0].w) || 1200;
    const html = SiteRender.buildSiteHtml(project, baseW);
    const fontLinks = (html.match(/<link[^>]*fonts\.googleapis[^>]*>/g) || []);
    const fontFaces = (html.match(/@font-face\{[^}]*\}/g) || []).join('');
    const waits = [];
    fontLinks.forEach(function(tag){
      const m = tag.match(/href="([^"]+)"/);
      if (m) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = m[1];
        document.head.appendChild(link);
        waits.push(new Promise(function(res){ link.onload = res; link.onerror = res; }));
      }
    });
    if (fontFaces) {
      const preStyle = document.createElement('style');
      preStyle.textContent = fontFaces;
      document.head.appendChild(preStyle);
    }
    await Promise.race([
      Promise.all(waits).then(function(){ return document.fonts.ready; }),
      new Promise(function(res){ setTimeout(res, 3000); })
    ]);
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('loading').innerHTML = '<div>홈페이지를 불러오지 못했습니다.</div><div style="font-size:13px;color:#889">'+(e.message||e)+'</div>';
  }
})();

// 내려둔 상태 화면 — 병원 연락처가 등록돼 있으면 함께 안내한다(환자가 전화는 걸 수 있도록).
async function showPaused(){
  let name = '', phone = '', addr = '';
  try{
    const c = await getDoc(doc(db, 'site', 'content'));
    if(c.exists()){ const d = c.data()||{}; name = d.hospitalName||''; phone = d.phone||''; addr = d.address||''; }
  }catch(e){}
  document.getElementById('loading').innerHTML =
    '<div style="font-size:38px">🛠️</div>'
    + '<div style="font-size:19px;font-weight:700;color:#334">홈페이지 준비 중입니다</div>'
    + '<div style="font-size:14px;color:#667">잠시 후 다시 방문해 주세요.</div>'
    + (name ? '<div style="margin-top:18px;font-size:15px;font-weight:700;color:#334">'+name+'</div>' : '')
    + (phone ? '<div style="font-size:14px"><a href="tel:'+phone.replace(/[^0-9+]/g,'')+'">'+phone+'</a></div>' : '')
    + (addr ? '<div style="font-size:13px;color:#889">'+addr+'</div>' : '');
}

function showEmpty(){
  document.getElementById('loading').innerHTML =
    '<div style="font-size:18px;font-weight:700">아직 발행된 홈페이지가 없습니다</div>'
    + '<div style="font-size:14px;color:#667">편집기에서 만든 뒤 <b>☁ 클라우드</b>로 저장하면 여기에 표시됩니다.</div>'
    + '<a href="/editor.html">편집기로 이동 →</a>';
}
</script>
</body>
</html>
